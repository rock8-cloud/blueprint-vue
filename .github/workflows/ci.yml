name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This project has no packageManager field; pin CI to the Bun version
      # used by the other Renovate-managed blueprints.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bunx oxfmt --check src/

      - name: Typecheck
        run: bun run type-check

      # The package scripts pass --fix, so invoke the checkers directly to
      # keep pull-request CI read-only.
      - name: Lint
        run: |
          bunx oxlint .
          bunx eslint .

      - name: Build
        run: bun run build

  docker:
    name: docker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t rock8cloud-vue-blueprint .
